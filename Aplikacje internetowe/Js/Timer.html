<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="timer">0</h1>
    <button onclick="zacznij()">Zacznij</button>
    <script>
    function inkrement(){
        let x = parseInt(document.getElementById("timer").innerHTML);
        ++x;
        document.getElementById("timer").innerHTML = x;

            }
            function zacznij()
            {
                setInterval(inkrement,1000)
            }
    </script>
</body>
</html>
